<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Sephora Thailand</title>
    
    <!-- Favicon and App Icons -->
    <link rel="icon" type="image/png" sizes="32x32" href="/sephora.png?v=2" />
    <link rel="icon" type="image/png" sizes="16x16" href="/sephora.png?v=2" />
    <link rel="icon" type="image/svg+xml" href="/sephora.svg?v=2" />
    <link rel="shortcut icon" href="/sephora.png?v=2" />
    <link rel="apple-touch-icon" sizes="180x180" href="/sephora.png?v=2" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="color-scheme" content="light" />

    <!-- Open Graph / Facebook / LINE sharing meta tags -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Sephora Thailand" />
    <meta property="og:description" content="ช้อปสกินแคร์ เครื่องสำอาง น้ำหอม และบิวตี้ไอเทมยอดนิยมระดับโลกได้ที่ Sephora Thailand" />
    <meta property="og:image" content="https://ais-pre-gqghljcpxacus4prddvzdw-1047113194423.asia-southeast1.run.app/sephora.png" />
    <meta property="og:site_name" content="Sephora" />

    <!-- Twitter sharing meta tags -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Sephora Thailand" />
    <meta name="twitter:description" content="ช้อปสกินแคร์ เครื่องสำอาง น้ำหอม และบิวตี้ไอเทมยอดนิยมระดับโลกได้ที่ Sephora Thailand" />
    <meta name="twitter:image" content="https://ais-pre-gqghljcpxacus4prddvzdw-1047113194423.asia-southeast1.run.app/sephora.png" />
  </head>
  <body style="background-color: #fafafa; margin: 0; padding: 0; min-height: 100vh; color: #171717; -webkit-font-smoothing: antialiased;">
    <div id="initial-splash" style="position: fixed; inset: 0; z-index: 999999; pointer-events: none; background-color: #fafafa; display: flex; flex-direction: column; align-items: center; justify-content: center; font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; transition: opacity 0.3s ease-out;">
      <style>
        @keyframes sephora-pulse {
          0%, 100% { transform: scale(1); opacity: 1; }
          50% { transform: scale(1.03); opacity: 0.85; }
        }
        .splash-title {
          font-size: 2.25rem;
          font-weight: 900;
          letter-spacing: 0.3em;
          margin: 0;
          padding-left: 0.3em;
          color: #111827;
          animation: sephora-pulse 2s ease-in-out infinite;
        }
        @keyframes bar-move {
          0% { left: -100%; }
          100% { left: 100%; }
        }
        .splash-bar {
          position: relative;
          width: 120px;
          height: 3px;
          background-color: #e5e7eb;
          overflow: hidden;
          border-radius: 9999px;
          margin-top: 18px;
        }
        .splash-bar-inner {
          position: absolute;
          top: 0;
          bottom: 0;
          width: 50%;
          background: linear-gradient(90deg, #111827, #ef4444, #111827);
          animation: bar-move 1.2s ease-in-out infinite;
        }
      </style>
      <div style="position: relative; display: flex; flex-direction: column; align-items: center; text-align: center;">
        <h1 class="splash-title">SEPHORA</h1>
        <p style="color: #6b7280; font-size: 11px; margin-top: 8px; margin-bottom: 0; letter-spacing: 0.2em; text-transform: uppercase; font-weight: 700;">THAILAND</p>
        <div class="splash-bar">
          <div class="splash-bar-inner"></div>
        </div>
      </div>
    </div>
    <div id="root"></div>
    <script>
      // Immediate failsafe: remove static splash smoothly after load
      setTimeout(function() {
        var s = document.getElementById('initial-splash');
        if (s) {
          s.style.opacity = '0';
          setTimeout(function() {
            if (s && s.parentNode) s.parentNode.removeChild(s);
          }, 300);
        }
      }, 350);
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
