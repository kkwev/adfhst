<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Sephora Thailand</title>
    
    <!-- Favicon and App Icons -->
    <link rel="icon" type="image/png" sizes="32x32" href="/sephora.png?v=2" />
    <link rel="icon" type="image/png" sizes="16x16" href="/sephora.png?v=2" />
    <link rel="icon" type="image/svg+xml" href="/sephora.svg?v=2" />
    <link rel="shortcut icon" href="/sephora.png?v=2" />
    <link rel="apple-touch-icon" sizes="180x180" href="/sephora.png?v=2" />

    <!-- Open Graph / Facebook / LINE sharing meta tags -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Sephora Thailand" />
    <meta property="og:description" content="ช้อปสกินแคร์ เครื่องสำอาง น้ำหอม และบิวตี้ไอเทมยอดนิยมระดับโลกได้ที่ Sephora Thailand" />
    <meta property="og:image" content="https://ais-pre-gqghljcpxacus4prddvzdw-1047113194423.asia-southeast1.run.app/sephora.png" />
    <meta property="og:site_name" content="Sephora" />

    <!-- Twitter sharing meta tags -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Sephora Thailand" />
    <meta name="twitter:description" content="ช้อปสกินแคร์ เครื่องสำอาง น้ำหอม และบิวตี้ไอเทมยอดนิยมระดับโลกได้ที่ Sephora Thailand" />
    <meta name="twitter:image" content="https://ais-pre-gqghljcpxacus4prddvzdw-1047113194423.asia-southeast1.run.app/sephora.png" />
  </head>
  <body style="background-color: #000000; margin: 0; padding: 0;">
    <div id="root">
      <div id="initial-splash" style="position: fixed; inset: 0; z-index: 999999; background-color: #000000; display: flex; flex-direction: column; align-items: center; justify-content: center; font-family: system-ui, -apple-system, sans-serif; transition: opacity 0.5s ease-out;">
        <style>
          @keyframes sunlight-shimmer {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
          }
          .shimmer-logo {
            font-size: 2.75rem;
            font-weight: 900;
            letter-spacing: 0.35em;
            margin: 0;
            padding-left: 0.35em;
            background: linear-gradient(110deg, #ffffff 15%, #fef08a 40%, #ffffff 50%, #fef08a 60%, #ffffff 85%);
            background-size: 200% 100%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: sunlight-shimmer 2s linear infinite;
            text-shadow: 0 0 25px rgba(254, 240, 138, 0.25);
          }
          @keyframes pulse-sun-aura {
            0%, 100% { opacity: 0.25; transform: scale(0.95); }
            50% { opacity: 0.65; transform: scale(1.1); }
          }
          .sun-aura {
            position: absolute;
            width: 280px;
            height: 90px;
            background: radial-gradient(circle, rgba(254, 240, 138, 0.35) 0%, rgba(245, 158, 11, 0.15) 45%, transparent 75%);
            filter: blur(25px);
            animation: pulse-sun-aura 3s ease-in-out infinite;
            pointer-events: none;
          }
          @keyframes bar-move {
            0% { left: -100%; }
            100% { left: 100%; }
          }
          .loader-bar {
            position: relative;
            width: 140px;
            height: 2px;
            background-color: rgba(255, 255, 255, 0.15);
            overflow: hidden;
            border-radius: 9999px;
            margin-top: 24px;
          }
          .loader-bar-inner {
            position: absolute;
            top: 0;
            bottom: 0;
            width: 50%;
            background: linear-gradient(90deg, transparent, #fef08a, #ffffff, transparent);
            animation: bar-move 1.5s ease-in-out infinite;
          }
        </style>
        <div style="position: relative; display: flex; flex-direction: column; align-items: center; text-align: center;">
          <div class="sun-aura"></div>
          <h1 class="shimmer-logo">SEPHORA</h1>
          <p style="color: rgba(255, 255, 255, 0.5); font-size: 11px; margin-top: 10px; margin-bottom: 0; letter-spacing: 0.2em; text-transform: uppercase; font-weight: 600;">SEPHORA THAILAND</p>
          <div class="loader-bar">
            <div class="loader-bar-inner"></div>
          </div>
          <p style="color: rgba(255, 255, 255, 0.4); font-size: 10px; margin-top: 12px; margin-bottom: 0; font-weight: 500;">กำลังโหลดข้อมูลและเชื่อมต่อระบบ...</p>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
